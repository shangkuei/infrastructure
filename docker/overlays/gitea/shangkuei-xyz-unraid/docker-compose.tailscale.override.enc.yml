# Gitea - Tailscale Override with Cloudflared Network
# Tailscale sidecar for direct tailnet access
# Service joins cloudflared network for tunnel access
#
# Required: Set TS_AUTHKEY in environment or .env file
# Generate key at: https://login.tailscale.com/admin/settings/keys
